<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Disable Browser Caching -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>NYHL Vaughan Rangers Red U13 Tier 2 Standings </title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 p-4 font-sans max-w-lg mx-auto">
  <div class="flex justify-between items-center mb-4">
    <div>
      <h1 class="text-lg font-bold text-amber-400">U13 Tier 2 Standings</h1>
      <p id="timestamp" class="text-[11px] text-slate-400">Last Updated: Loading...</p>
    </div>
  </div>

  <div class="overflow-x-auto rounded-lg border border-slate-800 shadow-xl">
    <table class="w-full text-xs text-left text-slate-300">
      <thead class="text-slate-400 uppercase bg-slate-900 border-b border-slate-800">
        <tr>
          <th class="py-3 px-2 text-center">#</th>
          <th class="py-3 px-3">Team</th>
          <th class="py-3 px-2 text-center">GP</th>
          <th class="py-3 px-2 text-center">W</th>
          <th class="py-3 px-2 text-center">L</th>
          <th class="py-3 px-2 text-center">T</th>
          <th class="py-3 px-2 text-center font-bold text-white">PTS</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <!-- Injected dynamically -->
      </tbody>
    </table>
  </div>
  <p class="text-[10px] text-slate-500 text-center mt-3">NYHL U13 Tier 2 • Live Automated Mobile View</p>

  <script>
    // Updated automatically by the hourly GitHub Action script
    const lastUpdated = "Nov 08, 2026 - 09:37 PM";
    const standings = [
      { rank: 1, team: "York Mills Blue", gp: 4, w: 3, l: 0, t: 1, pts: 7 },
      { rank: 2, team: "Vaughan Red", gp: 3, w: 3, l: 0, t: 0, pts: 6 },
      { rank: 3, team: "Vaughan JCC", gp: 4, w: 2, l: 0, t: 2, pts: 6 },
      { rank: 4, team: "West Hill", gp: 4, w: 2, l: 1, t: 1, pts: 5 },
      { rank: 5, team: "Etobicoke", gp: 4, w: 1, l: 2, t: 1, pts: 3 },
      { rank: 6, team: "Scarborough Black", gp: 5, w: 1, l: 3, t: 1, pts: 3 },
      { rank: 7, team: "Forest Hill", gp: 5, w: 1, l: 4, t: 0, pts: 2 },
      { rank: 8, team: "Avenue Road Black", gp: 5, w: 0, l: 3, t: 2, pts: 2 }
    ];

    // Render Last Updated Timestamp
    document.getElementById('timestamp').innerText = `Last Updated: ${lastUpdated}`;

    // Render Table
    const tbody = document.getElementById('table-body');
    tbody.innerHTML = standings.map(row => `
      <tr class="border-b border-slate-900 ${row.team.toLowerCase().includes('vaughan red') ? 'bg-amber-500/10 font-bold text-amber-300' : ''}">
        <td class="py-3 px-2 text-center">${row.rank}</td>
        <td class="py-3 px-3">${row.team}</td>
        <td class="py-3 px-2 text-center">${row.gp}</td>
        <td class="py-3 px-2 text-center">${row.w}</td>
        <td class="py-3 px-2 text-center">${row.l}</td>
        <td class="py-3 px-2 text-center">${row.t}</td>
        <td class="py-3 px-2 text-center font-bold text-white">${row.pts}</td>
      </tr>
    `).join('');
  </script>
</body>
</html>

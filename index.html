<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Disable Browser Caching to Always Pull Fresh Data -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>NYHL U13 Tier 2 Standings</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 sm:p-8">
  <div class="max-w-4xl mx-auto">
    <!-- Header -->
    <div class="mb-6 text-center sm:text-left">
      <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white">NYHL U13 Tier 2 Standings</h1>
      <p id="update-time" class="text-sm text-slate-400 mt-1">Loading schedule information...</p>
    </div>

    <!-- Standings Table Container -->
    <div class="bg-slate-800 rounded-xl shadow-lg overflow-hidden border border-slate-700">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-700/50 text-slate-300 text-xs uppercase tracking-wider border-b border-slate-700">
              <th class="py-3 px-4 font-semibold">Rk</th>
              <th class="py-3 px-4 font-semibold">Team</th>
              <th class="py-3 px-4 font-semibold text-center">GP</th>
              <th class="py-3 px-4 font-semibold text-center">W</th>
              <th class="py-3 px-4 font-semibold text-center">L</th>
              <th class="py-3 px-4 font-semibold text-center">T</th>
              <th class="py-3 px-4 font-semibold text-center">Pts</th>
            </tr>
          </thead>
          <tbody id="standings-body" class="divide-y divide-slate-700 text-sm">
            <!-- Populated dynamically by script below -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // These placeholder strings get dynamically updated by your GitHub Action workflow every 30 mins
    const lastUpdated = "Nov 13, 2026 - 01:59 AM";
    const nextUpdate = "~02:00 AM";
    const standings = [];

    // Render Last Updated & Next Check info in header
    document.getElementById("update-time").textContent = `Last updated: ${lastUpdated} (Next check: ${nextUpdate})`;

    // Render Table Rows
    const tbody = document.getElementById("standings-body");
    
    if (standings.length === 0) {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td colspan="7" class="py-6 px-4 text-center text-slate-400">Waiting for first sync or parsing data...</td>`;
      tbody.appendChild(tr);
    } else {
      standings.forEach(item => {
        const tr = document.createElement("tr");
        tr.className = "hover:bg-slate-700/30 transition-colors";
        tr.innerHTML = `
          <td class="py-3 px-4 font-medium text-slate-300">${item.rank}</td>
          <td class="py-3 px-4 font-medium text-white">${item.team}</td>
          <td class="py-3 px-4 text-center text-slate-300">${item.gp}</td>
          <td class="py-3 px-4 text-center text-slate-300">${item.w}</td>
          <td class="py-3 px-4 text-center text-slate-300">${item.l}</td>
          <td class="py-3 px-4 text-center text-slate-300">${item.t}</td>
          <td class="py-3 px-4 text-center font-bold text-emerald-400">${item.pts}</td>
        `;
        tbody.appendChild(tr);
      });
    }
  </script>
</body>
</html>
